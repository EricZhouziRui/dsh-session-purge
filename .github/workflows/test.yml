name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: Syntax check
        run: node --check engine.js && node --check index.js && node --check client.js && node --check update.js
      - name: Build update manifest
        run: node scripts/build-update-manifest.mjs
      - name: Verify manifest is current
        run: git diff --exit-code update-manifest.json
      - name: Test
        run: node --test test/*.test.mjs
